name: 'npm installation'
description: 'Sets up Node.js, caches npm packages, and installs locked dependencies.'
author: 'VNCC'
branding: {icon: package, color: blue}

inputs:
  node-version:
    description: 'Node.js version for setup-node.'
    required: true
    default: '21'
  service-name:
    description: 'Workspace-relative npm project directory.'
    required: true

outputs:
  result:
    description: 'pass when npm ci completes.'
    value: ${{ steps.main-3.outputs.result }}

runs:
  using: composite
  steps:
    # =========== input section ===========
    - name: input / step 1 - export inputs
      shell: bash
      env:
        V1: ${{ inputs.node-version }}
        V2: ${{ inputs.service-name }}
      run: |
        set -euo pipefail
        [[ "$V1" =~ ^[0-9]+([.][A-Za-z0-9.+_-]+)?$ ]] || { echo "::error::node-version has invalid format"; exit 1; }
        [[ "$V2" != *$'\n'* && "$V2" != *$'\r'* ]] || { echo "::error::service-name cannot contain newlines"; exit 1; }
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        service_path="$(realpath -m "$workspace/$V2")"
        case "$service_path" in
          "$workspace"|"$workspace"/*) ;;
          *) echo "::error::service-name must stay inside GITHUB_WORKSPACE"; exit 1 ;;
        esac
        {
          printf 'IN_NODE_VERSION=%s\n' "$V1"
          printf 'IN_SERVICE_NAME=%s\n' "$V2"
          printf 'IN_SERVICE_PATH=%s\n' "$service_path"
        } >> "$GITHUB_ENV"

    - name: input / step 2 - validate npm project
      shell: bash
      run: |
        set -euo pipefail
        [[ -d "$IN_SERVICE_PATH" ]] || { echo "::error::npm project directory not found"; exit 1; }
        [[ -f "$IN_SERVICE_PATH/package.json" ]] || { echo "::error::package.json not found in npm project"; exit 1; }
        [[ -f "$IN_SERVICE_PATH/package-lock.json" ]] || { echo "::error::package-lock.json is required for npm ci"; exit 1; }

    # =========== setup section ===========
    - name: setup / step 1 - Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.IN_NODE_VERSION }}

    - name: setup / step 2 - npm cache
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: npm-

    # =========== main section ===========
    - name: main / step 1 - install npm dependencies
      shell: bash
      run: |
        set -euo pipefail
        cd "$IN_SERVICE_PATH"
        npm ci

    - name: main / step 2 - record completion
      shell: bash
      run: echo 'TMP_RESULT=pass' >> "$GITHUB_ENV"

    - name: main / step 3 - export outputs
      id: main-3
      shell: bash
      run: echo "result=$TMP_RESULT" >> "$GITHUB_OUTPUT"

    # =========== output section ===========
    - name: output / step 1 - print outputs
      shell: bash
      env:
        O1: ${{ steps.main-3.outputs.result }}
      run: echo "result=$O1"

    - name: output / step 2 - job summary
      shell: bash
      env:
        O1: ${{ steps.main-3.outputs.result }}
      run: |
        echo "npm dependency installation result: $O1" >> "$GITHUB_STEP_SUMMARY"
