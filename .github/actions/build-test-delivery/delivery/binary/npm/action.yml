name: 'npm build'
description: 'Runs optional npm tests and builds an npm project.'
author: 'VNCC'
branding: {icon: package, color: blue}

inputs:
  service-name:
    description: 'Workspace-relative npm project directory.'
    required: true
  run-tests:
    description: 'Run the npm test script when present; true or false.'
    default: 'true'

outputs:
  result:
    description: 'pass when tests (if enabled) and build complete.'
    value: ${{ steps.main-3.outputs.result }}

runs:
  using: composite
  steps:
    # =========== input section ===========
    - name: input / step 1 - export inputs
      shell: bash
      env:
        V1: ${{ inputs.service-name }}
        V2: ${{ inputs.run-tests }}
      run: |
        set -euo pipefail
        [[ "$V1" != *$'\n'* && "$V1" != *$'\r'* ]] || { echo "::error::service-name cannot contain newlines"; exit 1; }
        [[ "$V2" == true || "$V2" == false ]] || { echo "::error::run-tests must be true or false"; exit 1; }
        workspace="$(realpath "$GITHUB_WORKSPACE")"
        service_path="$(realpath -m "$workspace/$V1")"
        case "$service_path" in
          "$workspace"|"$workspace"/*) ;;
          *) echo "::error::service-name must stay inside GITHUB_WORKSPACE"; exit 1 ;;
        esac
        {
          printf 'IN_SERVICE_NAME=%s\n' "$V1"
          printf 'IN_SERVICE_PATH=%s\n' "$service_path"
          printf 'IN_RUN_TESTS=%s\n' "$V2"
        } >> "$GITHUB_ENV"

    - name: input / step 2 - validate project
      shell: bash
      run: |
        set -euo pipefail
        [[ -d "$IN_SERVICE_PATH" ]] || { echo "::error::npm project directory not found"; exit 1; }
        [[ -f "$IN_SERVICE_PATH/package.json" ]] || { echo "::error::package.json not found in npm project"; exit 1; }

    # =========== setup section ===========
    # The caller provides Node.js and npm; this action adds no external setup actions.

    # =========== main section ===========
    - name: main / step 1 - run optional tests
      shell: bash
      run: |
        set -euo pipefail
        cd "$IN_SERVICE_PATH"
        if [[ "$IN_RUN_TESTS" == true ]]; then
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts.test ? 0 : 1)"; then
            npm test -- --run
          else
            echo "No npm test script detected; skipping tests."
          fi
        fi

    - name: main / step 2 - build project
      shell: bash
      run: |
        set -euo pipefail
        cd "$IN_SERVICE_PATH"
        npm run build

    - name: main / step 3 - export outputs
      id: main-3
      shell: bash
      run: echo 'result=pass' >> "$GITHUB_OUTPUT"

    # =========== output section ===========
    - name: output / step 1 - print outputs
      shell: bash
      env:
        O1: ${{ steps.main-3.outputs.result }}
      run: echo "result=$O1"

    - name: output / step 2 - job summary
      shell: bash
      env:
        O1: ${{ steps.main-3.outputs.result }}
      run: |
        echo "npm build result: $O1" >> "$GITHUB_STEP_SUMMARY"
