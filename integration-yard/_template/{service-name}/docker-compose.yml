services:
  {service_name}:
    build:
      context: ../../standard_services/{service-directory}/
    env_file:
      - ./catalog/ci.env

  integration-test:
    build:
      context: ./test-container
    env_file:
      - ./catalog/ci.env
    environment:
      OPENAPI_SPEC: /contracts/openapi.yaml
      API_BASE_URL: http://{service_name}:REPLACE_WITH_PORT
    depends_on:
      - {service_name}
    volumes:
      - ../../standard_services/{service-directory}/api/openapi.yaml:/contracts/openapi.yaml:ro