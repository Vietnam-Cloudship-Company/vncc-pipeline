services:
  api_apache_apisix:
    build:
      context: ./svc-container
    env_file:
      - ./catalog/ci.env
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY through the CI environment or secret store}
    depends_on:
      etcd:
        condition: service_healthy
    networks:
      - yard

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - yard

  integration-test:
    build:
      context: ./test-container
    env_file:
      - ./catalog/ci.env
    environment:
      ADMIN_KEY: ${ADMIN_KEY:?Set ADMIN_KEY through the CI environment or secret store}
    depends_on:
      - api_apache_apisix
    networks:
      - yard
    expose:
      - "8081"

networks:
  yard:
    ipam:
      config:
        - subnet: 172.30.0.0/24
