apisix:
  node_listen:
    - 9080
  enable_ipv6: false
  enable_admin: false
  enable_control: false

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  http_server_configuration_snippet: |
    client_max_body_size 25m;
    proxy_request_buffering off;
    proxy_buffering off;
