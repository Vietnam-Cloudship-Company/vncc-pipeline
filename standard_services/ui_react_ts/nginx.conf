# For tesing purposes, this nginx.conf is used to serve the React SPA and reverse proxy API requests to the backend service. The configuration is designed to be flexible and can be adjusted based on the specific requirements of the application.
server {
    listen ${NGINX_LISTEN_PORT};
    server_name ${NGINX_SERVER_NAME};

    root ${NGINX_ROOT};
    index ${NGINX_INDEX};

    client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};

    # Health check
    location = ${NGINX_HEALTH_PATH} {
        access_log off;
        default_type text/plain;
        return 200 "${NGINX_HEALTH_RESPONSE}\n";
    }

    # API reverse proxy
    location ${API_BASE_PATH} {
        proxy_pass http://${API_HOST}:${API_PORT}${API_BASE_PATH};

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout ${NGINX_PROXY_CONNECT_TIMEOUT};
        proxy_send_timeout ${NGINX_PROXY_SEND_TIMEOUT};
        proxy_read_timeout ${NGINX_PROXY_READ_TIMEOUT};
    }

    # Static assets
    location /assets/ {
        expires ${NGINX_ASSET_CACHE};
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React SPA routing
    location / {
        try_files $uri $uri/ /${NGINX_INDEX};

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
